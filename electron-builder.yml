# electron-builder configuration – https://www.electron.build/configuration
appId: app.nama.desktop
productName: Nama
copyright: © Nama
artifactName: "Nama-${version}-${os}-${arch}.${ext}"
directories:
  output: release
  buildResources: build
asar: true
# Only the tiny Electron shell lives inside the asar; the Next.js standalone
# server, static assets and the seed DB are shipped as plain resources so the
# Prisma engine (.node) and the server can be executed directly.
files:
  - electron/dist/**/*
  - build/icon.png
  - package.json
  - "!node_modules/**"
# Next.js standalone server + assets + seed DB are copied by the afterPack hook
afterPack: scripts/electron-after-pack.cjs
npmRebuild: false
nodeGypRebuild: false
compression: normal
publish:
  provider: github
  owner: pvwvuow
  repo: frame
  releaseType: release
  publishAutoUpdate: true
win:
  icon: build/icon.png
  # NOTE: nsis + portable must NOT share an artifact name (they both default to
  # Nama-x.y.z-win-x64.exe → the portable overwrote the installer during upload
  # and the GitHub publish step timed out / latest.yml was never uploaded).
  artifactName: "Nama-${version}-win-${arch}-setup.${ext}"
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  verifyUpdateCodeSignature: false
portable:
  artifactName: "Nama-${version}-win-${arch}-portable.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Nama
  # NSIS bundled with electron-builder has no Persian .nlf – installer UI is English,
  # the app itself is fully Persian.
  installerLanguages: [en_US]
mac:
  icon: build/icon.png
  category: public.app-category.entertainment
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
dmg:
  title: Nama
linux:
  icon: build/icon.png
  desktop:
    entry:
      Name: Nama
      StartupWMClass: nama
  category: AudioVideo
  maintainer: Nama
  synopsis: Persian streaming desktop app
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

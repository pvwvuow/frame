name: One-off migration to pvame

# یک‌بارمصرف: تاریخچهٔ کامل frame را به pvame (مخزن خصوصی سورس) می‌راند و
# سِرِت‌های امضای اندروید + RELEASE_PAT را به Actions secrets همان مخزن کپی می‌کند.
# پس از اجرای موفق، این فایل و سِرِت MIG_PAT از frame حذف می‌شوند.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push full history (main + android + tags) to pvame
        env:
          PAT: ${{ secrets.MIG_PAT }}
        run: |
          set -euo pipefail
          # checkout@v4 یک http.extraheader با GITHUB_TOKEN خود frame روی همهٔ
          # URLهای github.com می‌گذارد که اعتبار URL-embedded را خنثی می‌کند؛
          # باید حذف شود تا push به pvame با MIG_PAT انجام شود.
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote add pvame "https://x-access-token:${PAT}@github.com/pvwvuow/pvame.git"
          git push pvame --force "refs/remotes/origin/main:refs/heads/main" "refs/remotes/origin/android:refs/heads/android"
          git push pvame --force --tags
          echo "== pvame branches after push =="
          git ls-remote --heads pvame
          echo "== pvame tag count =="
          git ls-remote --tags pvame | wc -l

      - name: Copy signing secrets + RELEASE_PAT into pvame Actions secrets
        env:
          PAT: ${{ secrets.MIG_PAT }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          pip install --quiet pynacl requests
          python3 - <<'PY'
          import base64, os, requests
          from nacl import encoding, public
          PAT = os.environ["PAT"]
          H = {"Authorization": "token " + PAT, "Accept": "application/vnd.github+json"}
          info = requests.get("https://api.github.com/repos/pvwvuow/pvame/actions/secrets/public-key", headers=H).json()
          box = public.SealedBox(public.PublicKey(info["key"].encode(), encoding.Base64Encoder()))
          values = {
              "ANDROID_KEYSTORE_B64": os.environ["KS_B64"],
              "ANDROID_KEYSTORE_PROPERTIES": os.environ["KS_PROPS"],
              "RELEASE_PAT": PAT,
          }
          for name, raw in values.items():
              resp = requests.put(
                  "https://api.github.com/repos/pvwvuow/pvame/actions/secrets/" + name,
                  headers=H,
                  json={"encrypted_value": base64.b64encode(box.encrypt(raw.encode())).decode(), "key_id": info["key_id"]},
              )
              print(name, "HTTP", resp.status_code)
              resp.raise_for_status()
          print("all secrets copied to pvame")
          PY

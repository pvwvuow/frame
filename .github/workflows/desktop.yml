name: Desktop (Electron) release

on:
  push:
    tags: ["v*"]
    # Also run on main: if package.json version was bumped and no tag exists for
    # it yet, the `prepare` job creates the tag and the release gets built.
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if a tag for the current version already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect version / create tag
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag push ($GITHUB_REF_NAME) → build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" == "true" ]]; then
              echo "Tag $TAG exists but force=true → build"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already exists → nothing to release (bump package.json version to publish)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Version $VERSION has no tag yet → creating $TAG on $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "build=true" >> "$GITHUB_OUTPUT"

      # Pre-create the GitHub release so the 3 OS build jobs never race on
      # release creation (electron-builder 422 already_exists → wasted retries)
      - name: Pre-create release object
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
               --title "Nama $TAG" \
               --notes "نما $TAG — ساخته‌شده توسط CI. See the app changelog inside the release notes of the main repository." \
               --latest

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Preflight gate
        run: node scripts/preflight.mjs --quick
        env:
          DATABASE_URL: "file:../db/custom.db"

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Startup regression tests (nama.db / orphan server)
        run: node scripts/test-startup-fixes.mjs

      - name: Build & publish desktop app
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_HTTP_TIMEOUT: "600000"

      - uses: actions/upload-artifact@v4
        with:
          name: nama-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

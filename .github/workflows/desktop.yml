name: Release (desktop + android)

on:
  push:
    tags: ["v*"]
    # Also run on main: if package.json version was bumped and no tag exists for
    # it yet, the `prepare` job creates the tag. The tag-push event then triggers
    # the ONE real build (v0.26.0: the main run itself sets build=false after tag
    # creation — every release used to be built TWICE, once per trigger).
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if a tag for the current version already exists"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  # v0.42.5 — actions:write is for the self-heal dispatch below (prepare creates a tag when a main
  # push bumps package.json without one) needs actions:write, because a tag
  # pushed with GITHUB_TOKEN does NOT fire the `on: push: tags` event
  # (GitHub's anti-recursion rule). Without the dispatch, the tag sat on the
  # remote with NO build ever running — v0.42.4 shipped a day late because of
  # exactly that deadlock.

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect version / create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
          # v0.42.5 hotfix — the self-heal `gh workflow run` in this step ran
          # UNAUTHENTICATED (v0.42.5 dispatch attempt: 3 fails → warning → tag
          # deadlock again, manually unblocked via PAT). gh needs GH_TOKEN in
          # THIS step's env; the job-level permissions alone are not enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag push ($GITHUB_REF_NAME) → build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" == "true" ]]; then
              echo "Tag $TAG exists but force=true → build"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already exists → nothing to release (bump package.json version to publish)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Version $VERSION has no tag yet → creating $TAG on $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          # v0.26.0 — the tag push event now triggers the (single) build run.
          # Building here AND on the tag push raced the same release twice.
          # v0.42.5 — EXCEPT the push above uses GITHUB_TOKEN, whose push
          # events never trigger workflows. Dispatch the build explicitly on
          # the fresh tag so prepare-created tags always ship. (Manually
          # PAT-pushed tags still take the real tag-push path; GITHUB_TOKEN
          # dispatches are the documented exception to the recursion rule.)
          DISPATCH_OK=false
          for _i in 1 2 3; do
            if gh workflow run desktop.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"; then
              DISPATCH_OK=true
              break
            fi
            sleep 5
          done
          if [[ "$DISPATCH_OK" != "true" ]]; then
            echo "::warning::could not dispatch the tag build — push the tag manually or run workflow_dispatch on $TAG"
          fi
          echo "build=false" >> "$GITHUB_OUTPUT"

      # Pre-create the GitHub release so the 3 OS build jobs never race on
      # release creation (electron-builder 422 already_exists → wasted retries)
      - name: Pre-create release object
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
               --title "Frame $TAG" \
               --notes "Frame $TAG — ساخته‌شده توسط CI. See the app changelog inside the release notes of the main repository." \
               --latest

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Decompress seed database (v0.34.0 — db/custom.db exceeds the 100MB blob cap)
        shell: bash
        run: |
          if command -v xz >/dev/null 2>&1; then
            xz -dk db/custom.db.xz
          else
            7z x -y db/custom.db.xz
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          # v0.42.6 — the old list only covered LINUX cache dirs: windows
          # (%LOCALAPPDATA%) and mac (~/Library/Caches) re-downloaded the
          # ~110MB Electron zip + nsis/winCodeSign/dmg tools on EVERY build.
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Preflight gate
        run: node scripts/preflight.mjs
        env:
          DATABASE_URL: "file:../db/custom.db"

      # F-3 — type gate: next build runs with ignoreBuildErrors:true, so the
      # release path never checked types. CI-only commits could ship type
      # regressions inside installers/OTA.
      - name: Type check
        run: npx tsc --noEmit

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Startup regression tests (nama.db / orphan server)
        run: node scripts/test-startup-fixes.mjs
      - name: Stream proxy / MKV subtitle tests
        run: node scripts/test-stream-proxy.mjs

      # v0.34.0 — the split catalog ships as RELEASE ASSETS (raw blobs cap at
      # 100MB; release assets at 2GiB). Ubuntu does the export once and
      # attaches core+part+version to the release the prepare job pre-created.
      - name: Build & attach split-catalog assets
        if: matrix.os == 'ubuntu-latest'
        run: |
          node scripts/export-catalog.mjs
          # BUG-034 — the split-catalog suite needs the exported assets; this
          # is the only place they exist. A regression here used to ship.
          node scripts/test-split-catalog.mjs
          # BUG-032 — glob the whole family: catalog-part-N.json (waves >60MB)
          # were never attached while version.json advertised them → 404 syncs
          gh release upload "$TAG" \
            public/catalog/catalog-*.json \
            public/catalog/version.json \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "catalog assets attached to $TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DATABASE_URL: "file:../db/custom.db"

      - name: Build & publish desktop app
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_HTTP_TIMEOUT: "600000"

      - uses: actions/upload-artifact@v4
        with:
          name: nama-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          # v0.26.0 — an empty release must FAIL, not upload nothing silently
          if-no-files-found: error

      - name: Assert electron artifacts exist
        shell: bash
        run: |
          ls release/ | head -20
          test -n "$(ls release/latest*.yml 2>/dev/null)" || { echo '::error::latest*.yml missing — updater feed would break'; exit 1; }

  android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Decompress seed database (v0.34.0 — db/custom.db exceeds the 100MB blob cap)
        shell: bash
        run: |
          if command -v xz >/dev/null 2>&1; then
            xz -dk db/custom.db.xz
          else
            7z x -y db/custom.db.xz
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # keystore.properties + frame-release.keystore are git-ignored; in CI
      # they come from the encrypted repo secrets. Missing secrets → unsigned
      # APK (installable only via "install anyway", so secrets should exist).
      - name: Restore Android signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PROPERTIES" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > android/frame-release.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > android/keystore.properties
            echo "signing config restored ($(wc -c < android/frame-release.keystore) bytes)"
          else
            echo "::warning::Android signing secrets missing → APK will be UNSIGNED"
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          # the APK path never touches the Electron binary — skip ~100MB
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-

      - name: Build Android APK (static export + cap sync + gradle)
        run: npm run android:apk
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DEST="Frame-${VERSION}-android.apk"
          cp "$SRC" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $DEST to release $TAG"

      # v0.17.0 — publish the APK SHA-256 in the release notes so users can
      # verify authenticity (the install guide in README references it).
      - name: Attach APK sha256 to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SUM=$(sha256sum "Frame-${VERSION}-android.apk" | cut -d' ' -f1)
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          printf '%s\n\n**SHA-256 (`%s`):** `%s`' "$BODY" "Frame-${VERSION}-android.apk" "$SUM" > body.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file body.md
          echo "APK sha256: $SUM"
          # v0.26.0 — also attach the hash as a DURABLE asset: hand-written
          # Persian notes PATCHed after the release were wiping this section.
          echo "$SUM  Frame-${VERSION}-android.apk" > "Frame-${VERSION}-android.apk.sha256"
          gh release upload "$TAG" "Frame-${VERSION}-android.apk.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      # v0.12.0 — the in-app updater OTA path: the static export as a zip.
      # Name encodes the required native revision (Frame-webbundle-v1.2.3-n2.zip)
      # so the app can pick bundle-OTA vs full-APK without extra metadata.
      # v0.16.0 — the bundle is CODE + catalog shards only (~20MB): the covers
      # library no longer lives in out/ (mobile-build.cjs strips it), so OTA
      # updates stop weighing ~130MB. Covers ride the split cover packs below.
      - name: Build web bundle (OTA) and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NATIVE_REV=$(grep -E '^nativeRev=' android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          DEST="Frame-webbundle-v${VERSION#v}-n${NATIVE_REV}.zip"
          rm -f "$DEST"
          # zip the CONTENTS of out/ (index.html at the zip root — the OTA
          # applier validates that and serves the folder as the web root).
          # v0.42.5 — the covers/* exclusion re-adds the BUNDLED-ART allowlist
          # (mobile-build.cjs BUNDLED_ART_TTS = metahub-blocked tts whose
          # curated art ships inside the package, e.g. tt0185906).
          (cd out && zip -qr "../$DEST" . -x "covers/*")
          if [ -d out/covers ]; then
            for tt in $(ls out/covers 2>/dev/null); do
              (cd out && zip -qr "../$DEST" "covers/$tt")
            done
          fi
          ls -la "$DEST"
          gh release upload "$TAG" "$DEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $DEST to release $TAG"

      # v0.16.0 — split cover packs: ordered ~12MB chunks staged by
      # mobile-build.cjs (.covers-pack/Frame-coverpack-rN-pNN.zip), merged
      # into the live web root by the app's applyCoverPack at runtime.
      - name: Upload cover pack parts (OTA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if compgen -G ".covers-pack/Frame-coverpack-*.zip" > /dev/null; then
            gh release upload "$TAG" .covers-pack/Frame-coverpack-*.zip --clobber --repo "$GITHUB_REPOSITORY"
            ls -la .covers-pack/
          else
            echo "::warning::no cover packs staged — covers stay on the metahub/placeholder fallback"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nama-${{ needs.prepare.outputs.version }}-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

name: Release (desktop + android)

on:
  push:
    tags: ["v*"]
    # Also run on main: if package.json version was bumped and no tag exists for
    # it yet, the `prepare` job creates the tag and the release gets built.
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if a tag for the current version already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect version / create tag
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Tag push ($GITHUB_REF_NAME) → build"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [[ "${FORCE:-false}" == "true" ]]; then
              echo "Tag $TAG exists but force=true → build"
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag $TAG already exists → nothing to release (bump package.json version to publish)"
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "Version $VERSION has no tag yet → creating $TAG on $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "build=true" >> "$GITHUB_OUTPUT"

      # Pre-create the GitHub release so the 3 OS build jobs never race on
      # release creation (electron-builder 422 already_exists → wasted retries)
      - name: Pre-create release object
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
               --title "Frame $TAG" \
               --notes "Frame $TAG — ساخته‌شده توسط CI. See the app changelog inside the release notes of the main repository." \
               --latest

  build:
    name: Build ${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Cache Electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Preflight gate
        run: node scripts/preflight.mjs --quick
        env:
          DATABASE_URL: "file:../db/custom.db"

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Startup regression tests (nama.db / orphan server)
        run: node scripts/test-startup-fixes.mjs
      - name: Stream proxy / MKV subtitle tests
        run: node scripts/test-stream-proxy.mjs

      - name: Build & publish desktop app
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_HTTP_TIMEOUT: "600000"

      - uses: actions/upload-artifact@v4
        with:
          name: nama-${{ needs.prepare.outputs.version }}-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: warn

  android:
    name: Build Android APK
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # keystore.properties + frame-release.keystore are git-ignored; in CI
      # they come from the encrypted repo secrets. Missing secrets → unsigned
      # APK (installable only via "install anyway", so secrets should exist).
      - name: Restore Android signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PROPERTIES" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > android/frame-release.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > android/keystore.properties
            echo "signing config restored ($(wc -c < android/frame-release.keystore) bytes)"
          else
            echo "::warning::Android signing secrets missing → APK will be UNSIGNED"
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK (static export + cap sync + gradle)
        run: npm run android:apk
        env:
          DATABASE_URL: "file:../db/custom.db"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DEST="Frame-${VERSION}-android.apk"
          cp "$SRC" "$DEST"
          gh release upload "$TAG" "$DEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $DEST to release $TAG"

      # v0.12.0 — the in-app updater OTA path: the static export as a zip.
      # Name encodes the required native revision (Frame-webbundle-v1.2.3-n2.zip)
      # so the app can pick bundle-OTA vs full-APK without extra metadata.
      - name: Build web bundle (OTA) and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          NATIVE_REV=$(grep -E '^nativeRev=' android/version.properties | cut -d= -f2 | tr -d '[:space:]')
          DEST="Frame-webbundle-v${VERSION#v}-n${NATIVE_REV}.zip"
          rm -f "$DEST"
          # zip the CONTENTS of out/ (index.html at the zip root — the OTA
          # applier validates that and serves the folder as the web root)
          (cd out && zip -qr "../$DEST" .)
          ls -la "$DEST"
          gh release upload "$TAG" "$DEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "attached $DEST to release $TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: nama-${{ needs.prepare.outputs.version }}-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

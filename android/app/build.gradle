apply plugin: 'com.android.application'

// Release signing (keystore.properties next to this file, git-ignored;
// in CI it is restored from the ANDROID_KEYSTORE_* GitHub secrets)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// App version authored by scripts/mobile-build.cjs (follows package.json)
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps['versionCode'] ?: '1').toInteger()
def appVersionName = versionProps['versionName'] ?: '1.0.0'
// v0.12.0 — native surface revision: bumped by scripts/mobile-build.cjs when
// native code/config changes. The in-app updater uses it to decide between a
// web-bundle OTA and a full APK download.
def appNativeRev = (versionProps['nativeRev'] ?: '1').toInteger()
// v0.16.0 — cover-pack revision baked into the APK: what poster/backdrop webp
// baseline the assets carry (0 = none). The in-app updater merges newer
// Frame-coverpack-r<N>.zip parts on top at runtime.
def appCoversRev = (versionProps['coversRev'] ?: '0').toInteger()

android {
    namespace = "ir.frame.nama"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.frame.nama"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // v0.12.0 — native player (Media3), download engine, OTA self-update
        buildConfigField "int", "NATIVE_REV", "${appNativeRev}"
        // v0.16.0 — cover-pack baseline revision
        buildConfigField "int", "COVERS_REV", "${appCoversRev}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // v0.12.0 — native playback for MKV/HEVC (WebView cannot demux Matroska)
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    // v0.16.1 — OkHttp datasource: desktop-parity HTTP behavior for playback
    // (broken/expired TLS certs on the dl hosts, cross-protocol redirects)
    implementation "androidx.media3:media3-datasource-okhttp:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

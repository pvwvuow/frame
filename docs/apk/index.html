<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png">
<meta http-equiv="refresh" content="4; url=../install.html">
<title>Frame — دانلود اندروید</title>
<style>
/* /apk — short link → the latest Frame Android APK (Supabase cloud mirror
   first, GitHub release as fallback). Resolves the newest release asset via
   the GitHub API, exactly like install.html does, so this link never goes
   stale across releases. No-JS fallback: meta refresh → install guide. */
@font-face{font-family:"Vazirmatn";src:url("../fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Vazirmatn";src:url("../fonts/Vazirmatn-Black.woff2") format("woff2");font-weight:900;font-display:swap}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;
  background:#0a0a0c;color:#f4f2ec;font-family:"Vazirmatn",Tahoma,sans-serif;text-align:center;
  background-image:radial-gradient(700px 380px at 80% -10%, rgba(229,9,20,.14), transparent 60%);
}
.box{padding:32px}
b{font-size:26px;font-weight:900;display:block;margin-bottom:12px}
b em{font-style:normal;color:#e50914}
p{color:#a7a49b;font-size:13px;line-height:2;margin:0}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.3em;color:#6d6a62;margin-top:18px;display:block}
.reel{width:44px;height:44px;margin:0 auto 18px;border-radius:50%;
  border:3px solid #232328;border-top-color:#e50914;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="reel"></div>
  <b>دانلود <em>فریم</em> اندروید</b>
  <p>در حال انتقال به آخرین نسخه… اگر منتقل نشد، <a href="../install.html" style="color:#f5b81b">راهنمای نصب</a></p>
  <span class="mono">FRAME&nbsp;·&nbsp;APK&nbsp;·&nbsp;LATEST</span>
</div>
<script>
(async () => {
  const MIRROR = "https://emqsegjeiyimoyncbhfn.supabase.co/storage/v1/object/public/releases/";
  const go = (u) => { try { location.replace(u); } catch (e) { location.href = u; } };
  try {
    const r = await fetch("https://api.github.com/repos/pvwvuow/frame/releases/latest", {
      headers: { Accept: "application/vnd.github+json", "User-Agent": "frame-apk-shortlink" },
    });
    if (r.ok) {
      const rel = await r.json();
      const apk = (rel.assets || []).find((a) => /^Frame-v?\d+\.\d+\.\d+-android\.apk$/i.test(a.name));
      if (apk) { go(MIRROR + encodeURIComponent(apk.name)); return; }
    }
  } catch (e) { /* api unreachable */ }
  go("https://github.com/pvwvuow/frame/releases/latest");
})();
</script>
</body>
</html>

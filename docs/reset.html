<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<title>Frame — بازیابی رمز عبور</title>
<link rel="preload" href="fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Vazirmatn-Black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
/* Frame password-reset page — reuses the landing design system (style.css):
   tokens --bg/--panel/--line/--red/--gold, .nav/.brand/.glow/.ic/.btn.
   Page-specific form styles below keep the same visual language. */
:root { color-scheme: dark; }
.stage{
  position:relative; min-height:calc(100dvh - 64px);
  display:grid; place-items:center; padding:36px 16px 42px; overflow:hidden;
}
.panel-card{
  position:relative; z-index:1; width:100%; max-width:432px;
  background:linear-gradient(180deg,var(--panel),var(--bg2));
  border:1px solid var(--line); border-radius:var(--r-lg);
  padding:30px 28px 26px; text-align:start;
  box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.03) inset;
}
.panel-card h1{font-size:1.32rem; line-height:1.6; margin-bottom:2px}
.sub{color:var(--mut); font-size:.92rem; line-height:1.9}
.head-row{display:flex; align-items:center; gap:.85rem; margin-bottom:14px}
.ic.xl{width:52px; height:52px; flex:none; margin:0}
.ic.gold{background:rgba(245,185,62,.12); color:var(--gold); border-color:rgba(245,185,62,.32)}
/* language pill */
.lang{
  margin-inline-start:auto; cursor:pointer; font-family:inherit; font-size:.8rem; font-weight:700;
  color:var(--mut); background:rgba(255,255,255,.04); border:1px solid var(--line2);
  border-radius:999px; padding:6px 14px; transition:.2s;
}
.lang:hover{color:var(--txt); border-color:#4a4a58; background:rgba(255,255,255,.07)}
/* form */
label.lb{display:block; margin-top:15px; font-size:.8rem; font-weight:700; color:var(--mut)}
.field{position:relative; margin-top:7px}
input{
  width:100%; padding:12.5px 15px; border-radius:14px; font-family:inherit; font-size:.95rem;
  border:1px solid var(--line2); background:#0b0b0f; color:var(--txt); outline:none;
  transition:border-color .18s, box-shadow .18s;
}
input::placeholder{color:var(--dim)}
input:focus{border-color:var(--red); box-shadow:0 0 0 3px rgba(240,18,46,.14)}
input.ok{border-color:rgba(74,222,128,.55); box-shadow:0 0 0 3px rgba(74,222,128,.10)}
input.has-eye{padding-inline-end:46px}
.eye{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border:0; border-radius:10px; cursor:pointer; display:grid; place-items:center;
  background:transparent; color:var(--dim); transition:.15s;
}
.eye:hover{color:var(--txt); background:rgba(255,255,255,.06)}
.eye .off{display:none}
.eye.on .eye-svg{display:none}
.eye.on .off{display:block}
.hint{margin-top:6px; font-size:.74rem; color:var(--dim)}
/* primary button = app .btn-red */
.btn-main{
  width:100%; margin-top:20px; padding:.9rem 1.4rem; border:0; border-radius:14px; cursor:pointer;
  font-family:inherit; font-size:.98rem; font-weight:800; color:#fff;
  background:linear-gradient(135deg,var(--red),#c90d24); box-shadow:0 8px 28px rgba(240,18,46,.32);
  transition:.2s; display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
}
.btn-main:hover:not(:disabled){background:linear-gradient(135deg,var(--red2),#e01230); transform:translateY(-1px)}
.btn-main:disabled{opacity:.55; cursor:default}
/* messages */
.msg{margin-top:15px; padding:12px 15px; border-radius:14px; font-size:.86rem; line-height:1.9}
.msg.err{border:1px solid rgba(240,18,46,.35); background:rgba(240,18,46,.09); color:#fecdd3}
.msg.ok{border:1px solid rgba(74,222,128,.3); background:rgba(74,222,128,.08); color:#bbf7d0}
.hidden{display:none}
/* states */
.center{text-align:center}
.spin{
  width:36px; height:36px; border-radius:50%; margin:22px auto 12px;
  border:3px solid rgba(255,255,255,.12); border-top-color:var(--red);
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.big-check{margin:0 auto 14px; width:66px; height:66px; border-radius:22px; display:grid; place-items:center;
  background:rgba(245,185,62,.12); border:1px solid rgba(245,185,62,.32); color:var(--gold)}
.done-title{font-size:1.25rem; font-weight:900; margin:2px 0 6px}
.btn-ghost{
  display:inline-flex; align-items:center; gap:.5rem; margin-top:18px; padding:.65rem 1.3rem;
  border-radius:14px; border:1px solid var(--line2); color:var(--txt); background:rgba(255,255,255,.03);
  font-family:inherit; font-size:.9rem; font-weight:800; cursor:pointer; transition:.2s; text-decoration:none;
}
.btn-ghost:hover{border-color:#4a4a58; background:rgba(255,255,255,.06)}
.page-foot{position:relative; z-index:1; margin-top:22px; text-align:center; font-size:.78rem; color:var(--dim)}
.page-foot a{color:var(--mut); text-decoration:none; border-bottom:1px solid var(--line2); padding-bottom:1px}
.page-foot a:hover{color:var(--txt); border-color:var(--red)}
.foot-note{margin-top:12px; text-align:start; font-size:.78rem; color:var(--dim); line-height:1.9}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:480px){ .panel-card{padding:24px 20px 22px} }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="https://pvwvuow.github.io/frame/" aria-label="فریم — صفحه‌ی اصلی">
      <img src="assets/icon-192.png" width="34" height="34" alt="لوگوی فریم">
      <span>فریم</span>
    </a>
    <button class="lang" id="langBtn" type="button">EN</button>
  </div>
</header>

<main class="stage">
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <section class="panel-card">
    <div id="s_working">
      <div class="center">
        <div class="spin" aria-hidden="true"></div>
        <p class="sub" id="t_verifying">در حال بررسی لینک بازیابی…</p>
      </div>
    </div>

    <div id="s_failed" class="hidden">
      <div class="head-row">
        <div class="ic xl" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <h1 id="t_title">بازیابی رمز عبور</h1>
      </div>
      <div class="msg err" id="t_failedMsg"></div>
      <p class="sub" id="t_failedHint" style="margin-top:10px"></p>
      <p class="foot-note" id="t_backHome"></p>
    </div>

    <div id="s_form" class="hidden">
      <div class="head-row">
        <div class="ic xl" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div>
          <h1 id="t_title">بازیابی رمز عبور</h1>
          <p class="sub" id="t_formHint">لینک تأیید شد. رمز جدید را انتخاب کن:</p>
        </div>
      </div>

      <form id="f" novalidate>
        <label class="lb" for="p1"><span id="t_pw1">رمز جدید</span></label>
        <div class="field">
          <input id="p1" class="has-eye" type="password" dir="ltr" autocomplete="new-password" minlength="6" required placeholder="••••••••">
          <button class="eye" id="e1" type="button" aria-label="نمایش رمز">
            <svg class="eye-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <p class="hint" id="t_pwHint">حداقل ۶ کاراکتر</p>

        <label class="lb" for="p2"><span id="t_pw2">تکرار رمز جدید</span></label>
        <div class="field">
          <input id="p2" class="has-eye" type="password" dir="ltr" autocomplete="new-password" minlength="6" required placeholder="••••••••">
          <button class="eye" id="e2" type="button" aria-label="نمایش رمز">
            <svg class="eye-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <div id="formErr" class="msg err hidden"></div>
        <button class="btn-main" id="btn" type="submit">ذخیره رمز</button>
      </form>
    </div>

    <div id="s_done" class="hidden center">
      <div class="big-check" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="done-title" id="t_doneMsg">رمز عوض شد! 🎉</p>
      <p class="sub" id="t_doneHint">حالا برگرد داخل اپ Frame و با رمز جدید وارد شو.</p>
      <a class="btn-ghost" href="https://pvwvuow.github.io/frame/" id="t_backApp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>بازگشت به فریم</span>
      </a>
    </div>
  </section>

  <p class="page-foot">فریم — سینمای خانگی · <a href="https://pvwvuow.github.io/frame/" id="t_homeLink">صفحه‌ی اصلی</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* Frame desktop password-reset landing (v0.70.0, R1-2; brand redesign 2026-09-25).
 * Canonical source: pvame/docs/reset.html — deployed to
 * https://pvwvuow.github.io/frame/reset.html (GitHub Pages, frame repo /docs).
 * The desktop app's recovery email opens HERE (the app's own origin is a
 * dead 127.0.0.1 port by then). Handles every Supabase recovery shape:
 *   #access_token=…  → implicit  → setSession
 *   ?code=…          → PKCE      → exchangeCodeForSession
 *   #token_hash=…    → OTP       → verifyOtp(recovery)
 * then updates the password with the in-browser session.
 * NOTE: this origin must stay listed in Supabase → Auth → Redirect URLs. */
const SUPABASE_URL = "https://emqsegjeiyimoyncbhfn.supabase.co";
const SUPABASE_KEY = "sb_publishable_m23eUV8cC-xqhqD-3P6Wsg_U5WsiM3E";

const L = {
  fa: {
    title: "بازیابی رمز عبور", verifying: "در حال بررسی لینک بازیابی…",
    formHint: "لینک تأیید شد. رمز جدید را انتخاب کن:",
    pw1: "رمز جدید", pw2: "تکرار رمز جدید", save: "ذخیره رمز", saving: "لطفاً صبر کنید…",
    pwHint: "حداقل ۶ کاراکتر",
    short: "رمز عبور باید حداقل ۶ کاراکتر باشد.", match: "دو رمز یکسان نیستند.",
    ok: "رمز عوض شد! 🎉", okHint: "حالا برگرد داخل اپ Frame و با رمز جدید وارد شو.",
    backApp: "بازگشت به فریم",
    expired: "لینک بازیابی منقضی شده یا قبلاً استفاده شده.",
    failedHint: "از داخل اپ (صفحه‌ی ورود ← «رمزت را فراموش کردی؟») لینک تازه بگیرید.",
    backHome: "می‌توانید از داخل اپ لینک تازه بگیرید.",
    empty: "این صفحه به لینک داخل ایمیل بازیابی نیاز دارد.",
    home: "صفحه‌ی اصلی", eye: "نمایش / مخفی کردن رمز",
  },
  en: {
    title: "Password recovery", verifying: "Verifying the recovery link…",
    formHint: "Link verified. Pick a new password:",
    pw1: "New password", pw2: "Repeat new password", save: "Save password", saving: "Please wait…",
    pwHint: "At least 6 characters",
    short: "Password must be at least 6 characters.", match: "The two passwords do not match.",
    ok: "Password changed! 🎉", okHint: "Now go back to the Frame app and sign in with the new password.",
    backApp: "Back to Frame",
    expired: "The recovery link has expired or was already used.",
    failedHint: "Request a fresh link inside the app (Sign-in → “Forgot your password?”).",
    backHome: "You can request a fresh link from inside the app.",
    empty: "This page needs the link from your recovery email.",
    home: "Home page", eye: "Show / hide password",
  },
};
let lang = (navigator.language || "").toLowerCase().startsWith("fa") ? "fa" : "fa";
const $ = (id) => document.getElementById(id);
function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
  document.title = "Frame — " + L[lang].title;
  const t = L[lang];
  document.querySelectorAll("#t_title").forEach((el) => (el.textContent = t.title));
  $("t_verifying").textContent = t.verifying;
  $("t_formHint").textContent = t.formHint;
  $("t_pw1").textContent = t.pw1;
  $("t_pw2").textContent = t.pw2;
  $("t_pwHint").textContent = t.pwHint;
  $("btn").textContent = t.save;
  $("t_doneMsg").textContent = t.ok;
  $("t_doneHint").textContent = t.okHint;
  $("t_backHome").textContent = t.backHome;
  $("t_backApp").querySelector("span").textContent = t.backApp;
  $("t_homeLink").textContent = t.home;
  $("langBtn").textContent = lang === "fa" ? "EN" : "فارسی";
  $("e1").setAttribute("aria-label", t.eye);
  $("e2").setAttribute("aria-label", t.eye);
}
$("langBtn").onclick = () => { lang = lang === "fa" ? "en" : "fa"; applyLang(); };
applyLang();

/* show/hide password */
for (const [inputId, btnId] of [["p1", "e1"], ["p2", "e2"]]) {
  $(btnId).addEventListener("click", () => {
    const inp = $(inputId);
    const show = inp.type === "password";
    inp.type = show ? "text" : "password";
    $(btnId).classList.toggle("on", show);
    inp.focus();
  });
}
/* green ring when the repeat matches */
$("p2").addEventListener("input", () => {
  const same = $("p2").value.length >= 6 && $("p1").value === $("p2").value;
  $("p2").classList.toggle("ok", same);
});

function show(section) {
  for (const s of ["s_working", "s_form", "s_failed", "s_done"]) $(s).classList.add("hidden");
  $(section).classList.remove("hidden");
}
function fail(msg, expired) {
  const t = L[lang];
  $("t_failedMsg").textContent = msg || (expired ? t.expired : "");
  $("t_failedHint").textContent = t.failedHint;
  show("s_failed");
}
function cleanUrl() { try { history.replaceState(null, "", location.pathname); } catch (e) {} }
const parse = (s) => new URLSearchParams((s || "").replace(/^[?#]/, ""));

async function boot() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const q = parse(location.search), h = parse(location.hash);
  let session = null;
  try {
    if (h.get("access_token") && h.get("refresh_token")) {
      const r = await sb.auth.setSession({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token") });
      if (r.error) throw r.error;
      session = r.data.session;
    } else if (q.get("code")) {
      const r = await sb.auth.exchangeCodeForSession(location.href);
      if (r.error) throw r.error;
      session = r.data.session;
    } else if (q.get("token_hash") || h.get("token_hash")) {
      const r = await sb.auth.verifyOtp({ type: (q.get("type") || h.get("type") || "recovery"), token_hash: (q.get("token_hash") || h.get("token_hash")) });
      if (r.error) throw r.error;
      session = r.data.session;
    } else if (q.get("error") || h.get("error")) {
      throw new Error(decodeURIComponent(q.get("error_description") || h.get("error_description") || "link error"));
    } else {
      const cur = await sb.auth.getSession();
      session = cur && cur.data && cur.data.session;
      if (!session) { fail(L[lang].empty); return; }
    }
  } catch (e) {
    cleanUrl();
    const m = String((e && e.message) || e);
    fail(/expired|invalid/i.test(m) ? L[lang].expired : m, true);
    return;
  }
  cleanUrl();
  show("s_form");
  $("p1").focus();

  $("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const t = L[lang];
    const p1 = $("p1").value, p2 = $("p2").value;
    const errBox = $("formErr");
    errBox.classList.add("hidden");
    if ((p1 || "").length < 6) { errBox.textContent = t.short; errBox.classList.remove("hidden"); return; }
    if (p1 !== p2) { errBox.textContent = t.match; errBox.classList.remove("hidden"); return; }
    $("btn").disabled = true; $("btn").textContent = t.saving;
    try {
      const r = await sb.auth.updateUser({ password: p1 });
      if (r.error) throw r.error;
      show("s_done");
    } catch (e) {
      errBox.textContent = String((e && e.message) || e);
      errBox.classList.remove("hidden");
      $("btn").disabled = false; $("btn").textContent = t.save;
    }
  });
}
boot();
</script>
</body>
</html>
